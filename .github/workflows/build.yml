name: Build & Release Extasis Marimba

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS (Universal Binary)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up CMake & Ninja
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x'

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build Targets (VST3, AU, Standalone)
        run: cmake --build build --config Release --parallel

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ExtasisMarimba-macOS-Universal
          path: |
            build/ExtasisMarimba_artefacts/Release/VST3/ExtasisMarimba.vst3
            build/ExtasisMarimba_artefacts/Release/AU/ExtasisMarimba.component
            build/ExtasisMarimba_artefacts/Release/Standalone/ExtasisMarimba.app

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -A x64

      - name: Build Targets
        run: cmake --build build --config Release --parallel

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ExtasisMarimba-Windows-x64
          path: |
            build/ExtasisMarimba_artefacts/Release/VST3/ExtasisMarimba.vst3
            build/ExtasisMarimba_artefacts/Release/Standalone/ExtasisMarimba.exe
