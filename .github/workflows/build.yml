name: Build and Release ExtasisMarimba

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            artifact_name: Windows-Build
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DJUCE_COPY_PLUGIN_AFTER_BUILD=FALSE
          - name: Linux (x64)
            os: ubuntu-latest
            artifact_name: Linux-Build
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DJUCE_COPY_PLUGIN_AFTER_BUILD=FALSE

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev libfreetype6-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev ninja-build

      - name: Setup MSVC Developer Command Prompt (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja (Mac/Win)
        if: runner.os != 'Linux'
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" ${{ matrix.cmake_args }}

      - name: Build Plugin & Standalone
        run: |
          cmake --build build --config Release --parallel

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p artifacts

          # VST3
          find build -type d -name "*.vst3" -exec cp -r {} artifacts/ \; 2>/dev/null || true
          find build -type f -name "*.vst3" -exec cp -r {} artifacts/ \; 2>/dev/null || true

          # Standalone & CLAP
          find build -type f -name "*.exe" -exec cp {} artifacts/ \; 2>/dev/null || true
          find build -type f -name "*.clap" -exec cp {} artifacts/ \; 2>/dev/null || true

          # Linux Standalone
          find build -type f -executable -name "Extasis*" -exec cp {} artifacts/ \; 2>/dev/null || true

          # Docs, License & Installers
          if [ -d "installer" ]; then
            cp -r installer artifacts/
            chmod +x artifacts/installer/INSTALL_LINUX.sh 2>/dev/null || true
          fi
          cp install_windows.bat artifacts/ 2>/dev/null || true
          for doc in LICENSE MANUAL.md README.md PRESENTATION.md TECHNICAL.md CHANGELOG.md; do
            if [ -f "$doc" ]; then cp "$doc" artifacts/; fi
          done

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Windows-Build
          path: release-files/Windows/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Linux-Build
          path: release-files/Linux/

      - name: Package Release Files
        run: |
          mkdir -p final-assets
          cd release-files
          if [ -d "Windows" ]; then zip -r ../final-assets/ExtasisMarimba-Windows.zip Windows/; fi
          if [ -d "Linux" ]; then zip -r ../final-assets/ExtasisMarimba-Linux.zip Linux/; fi
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Extasis Marimba ${{ github.ref_name }} (Free & Open Source)"
          body: |
            ### 🪵 Extasis Marimba ${{ github.ref_name }} — 100% Free & Open Source (GPLv3)

            **Extasis Marimba** is now completely **free and open source** under the **GNU General Public License v3.0** — no DRM, no demo timers, no serial keys!

            #### 📦 Direct Binary Downloads:
            - 🍏 **[Download for macOS (VST3 / AU / Standalone)](https://github.com/laurorobles/ExtasisMarimba/releases/download/${{ github.ref_name }}/ExtasisMarimba-macOS.zip)** (Apple Silicon & Intel)
            - 🪟 **[Download for Windows (VST3 / Standalone)](https://github.com/laurorobles/ExtasisMarimba/releases/download/${{ github.ref_name }}/ExtasisMarimba-Windows.zip)** (x64)
            - 🐧 **[Download for Linux (VST3 / Standalone)](https://github.com/laurorobles/ExtasisMarimba/releases/download/${{ github.ref_name }}/ExtasisMarimba-Linux.zip)** (x64)

            ---

            ### ✨ What's New in ${{ github.ref_name }}
            - 🔓 **100% Free & Open Source (GPLv3):** Removed all licensing overlays, serial checks, and 10-minute demo limits.
            - ⚡ **Lock-Free Real-Time DSP Engine:** Replaced mutex-locked oscilloscope & `rand()` calls with a zero-allocation SPSC ring buffer and per-voice `XorShift32` PRNGs.
            - 🎚️ **Equal-Power Panning & Stereo Courtyard Ambience:** Upgraded to proper equal-power key-tracked panning and decorrelated dual-channel room reflections.
            - 🎹 **Expressive MIDI & Smart Voice Stealing:** Added Sustain Pedal (CC 64), Pitch Bend (±2 semitones), Nyquist-safe filtering up to 192 kHz, and quietest-voice stealing.
            - 🖥️ **Upgraded 680×420 Studio GUI:** Symmetrical 3-module layout, restored `SAVE` preset button (fixing the 40-preset user offset bug), new `INIT` & `RND` (musical randomizer) buttons, double-click knob reset, live `VOICES X/16` counter, dynamic 1:4:10 modal meters, and live `PAD: C4` pitch badge.

            ---

            ### ❤️ Support Independent Audio Software
            Extasis Marimba is free forever. If you love it, star this repo or check out **[Extasis Records on Bandcamp](https://extasisrecords.bandcamp.com)**.
          generate_release_notes: true
          files: final-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
