name: Build and Release ExtasisMarimba

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            artifact_name: Windows-Build
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DJUCE_COPY_PLUGIN_AFTER_BUILD=FALSE
          - name: macOS (Universal)
            os: macos-latest
            artifact_name: macOS-Build
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DJUCE_COPY_PLUGIN_AFTER_BUILD=FALSE
          - name: Linux (x64)
            os: ubuntu-latest
            artifact_name: Linux-Build
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DJUCE_COPY_PLUGIN_AFTER_BUILD=FALSE

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev libfreetype6-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev ninja-build

      - name: Setup MSVC Developer Command Prompt (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja (Mac/Win)
        if: runner.os != 'Linux'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" ${{ matrix.cmake_args }}

      - name: Build Plugin & Standalone
        run: |
          cmake --build build --config Release --parallel

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          
          # Find and copy any generated bundles/binaries
          find build -type d -name "*.vst3" -exec cp -r {} artifacts/ \; 2>/dev/null || true
          find build -type d -name "*.component" -exec cp -r {} artifacts/ \; 2>/dev/null || true
          find build -type d -name "*.app" -exec cp -r {} artifacts/ \; 2>/dev/null || true
          find build -type f -name "*.clap" -exec cp {} artifacts/ \; 2>/dev/null || true
          find build -type f -name "*.exe" -exec cp {} artifacts/ \; 2>/dev/null || true

          # Installers and docs
          if [ -d "installer" ]; then
            cp -r installer artifacts/
            chmod +x artifacts/installer/INSTALL_MAC.command 2>/dev/null || true
            chmod +x artifacts/installer/INSTALL_LINUX.sh 2>/dev/null || true
          fi
          cp install_mac.sh install_windows.bat artifacts/ 2>/dev/null || true
          for doc in MANUAL.md README.md PRESENTATION.md TECHNICAL.md FICHA_TECNICA.md ARCHITECTURE.md RELEASE_RULES.md CHANGELOG.md; do
            if [ -f "$doc" ]; then cp "$doc" artifacts/; fi
          done

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Windows-Build
          path: release-files/Windows/

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macOS-Build
          path: release-files/macOS/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Linux-Build
          path: release-files/Linux/

      - name: Package Release Files
        run: |
          mkdir -p final-assets
          cd release-files
          if [ -d "Windows" ]; then zip -r ../final-assets/ExtasisMarimba-Windows.zip Windows/; fi
          if [ -d "macOS" ]; then zip -r ../final-assets/ExtasisMarimba-macOS.zip macOS/; fi
          if [ -d "Linux" ]; then zip -r ../final-assets/ExtasisMarimba-Linux.zip Linux/; fi
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Extasis Marimba ${{ github.ref_name }}"
          body: |
            ### 🚀 Lanzamiento Oficial ${{ github.ref_name }}
            
            Este release incluye los binarios e instaladores oficiales para **Extasis Marimba** en macOS, Windows y Linux.
            
            #### 📦 Descarga Directa de Binarios:
            - 🍏 **[Descargar para macOS (VST3 / AU / Standalone)](https://github.com/laurorobles/ExtasisMarimba/releases/download/${{ github.ref_name }}/ExtasisMarimba-macOS.zip)** (Universal Binary arm64 + x86_64)
            - 🪟 **[Descargar para Windows (VST3 / Standalone)](https://github.com/laurorobles/ExtasisMarimba/releases/download/${{ github.ref_name }}/ExtasisMarimba-Windows.zip)** (x64)
            - 🐧 **[Descargar para Linux (VST3 / Standalone)](https://github.com/laurorobles/ExtasisMarimba/releases/download/${{ github.ref_name }}/ExtasisMarimba-Linux.zip)** (x64)
            
            ---
            
            **Novedades en ${{ github.ref_name }}:**
            - 🪵 **Afinación de Maderas 1:4:10:** Modos inarmónicos basados en maderas talladas de hormiguillo (Fundamental, 4.0× octava, 10.0× doble octava + tercera).
            - 🎚️ **Paneo Acústico por Nota (Key-Tracked Panning):** Graves a la izquierda, agudos a la derecha, controlable con `SPREAD`.
            - ⏱️ **Decay Acústico Progresivo:** Los agudos decaen de inmediato ("tock" seco) mientras los graves sostienen con riqueza armónica.
            - 🐝 **La Cachimba (Membrana de Tripa y Cera):** Ruido dinámico excitado por velocidad acústica y resonancia de tubo.
            - 🎨 **40 Presets de Fábrica:** 4 familias especializadas (Folklore Tradicional, Latin Club / Urbano, Concierto / Mundo, Experimental).
            - 🖥️ **Interfaz Expandida (660×410 px):** Márgenes amplios, etiquetas en inglés, menú de presets ensanchado con botón `SAVE`.
            - ⏱️ **Modo Evaluación / Demo:** Sesión de 10 minutos con silenciado automático, reiniciable al recargar el plugin.
            
            ---
            
            ### 🔑 Licencia y Activación
            Consigue tu clave de licencia oficial en **[Gumroad](http://laurorobles.gumroad.com)**.
            *El plugin funcionará en modo demo (silenciado a los 10 minutos de uso continuo) hasta ingresar la licencia.*
          generate_release_notes: true
          files: final-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
